# 在仓库根目录执行：
#   docker compose -f docker/docker-compose.yaml up --build
# 或在 docker/ 目录执行（需保证能解析到仓库根的 .env / 构建上下文）：
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: recording-transcription-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recording_transcription
    ports:
      # 宿主机 5432 常被占用时改用 5433；容器内仍是 5432（api 用 db:5432）
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recording_transcription"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: recording-transcription-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # LLM / Worker / 日志等从仓库根 .env 注入（勿在下方用 ${VAR:-} 再覆盖，
    # 否则在 docker/ 下插值常为空，会把 Key 冲成空字符串）
    env_file:
      - path: ../.env
        required: false
    environment:
      # 仅覆盖 Docker 网络与路径（必须覆盖 .env 里可能写的 127.0.0.1）
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/recording_transcription"
      UPLOAD_DIR: "/app/uploads"
      LOG_DIR: "/app/logs"
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
